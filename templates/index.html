<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEG - Math Exercise Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 380px;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 25px 20px;
            flex-shrink: 0;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .sidebar h1 span {
            color: #4fc3f7;
        }

        .sidebar .subtitle {
            font-size: 13px;
            color: #90caf9;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        /* Categorías en sidebar */
        .categoria {
            margin-bottom: 20px;
        }

        .categoria-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: 0.2s;
            font-weight: 600;
            font-size: 15px;
        }

        .categoria-header:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .categoria-header .toggle {
            font-size: 12px;
            color: #90caf9;
            transition: 0.2s;
        }

        .categoria-header .toggle.abierto {
            transform: rotate(180deg);
        }

        .subtipos {
            margin-top: 8px;
            padding-left: 10px;
            display: none;
        }

        .subtipos.abierto {
            display: block;
        }

        .subtipo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 13px;
        }

        .subtipo-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .subtipo-item .controles {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtipo-item .controles button {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .subtipo-item .controles button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .subtipo-item .controles .cantidad {
            min-width: 24px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
        }

        .subtipo-item .badge-tipo {
            font-size: 10px;
            color: #90caf9;
            background: rgba(255, 255, 255, 0.08);
            padding: 1px 8px;
            border-radius: 12px;
        }

        /* Botón generar en sidebar */
        .sidebar .btn-generar {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4fc3f7 0%, #0f3460 100%);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar .btn-generar:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(79, 195, 247, 0.3);
        }

        .sidebar .btn-preview {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: transparent;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar .btn-preview:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar .opciones-extra {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 13px;
            color: #90caf9;
        }

        .sidebar .opciones-extra input[type="checkbox"] {
            accent-color: #4fc3f7;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .sidebar .total-ejercicios {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #4fc3f7;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            padding: 30px 40px;
            background: #f0f2f5;
            min-height: 100vh;
        }

        .main-content .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .main-content .header h2 {
            font-size: 22px;
            color: #1e293b;
        }

        .main-content .header .acciones {
            display: flex;
            gap: 10px;
        }

        .main-content .header .acciones button {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }

        .btn-imprimir {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-limpiar {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-imprimir:hover,
        .btn-limpiar:hover {
            transform: scale(1.02);
        }

        /* ===== RESULTADOS ===== */
        #resultados {
            display: none;
        }

        #resultados .result-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        #resultados .result-stats .stat {
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            font-size: 14px;
        }

        #resultados .result-stats .stat strong {
            color: #0f3460;
        }

        .ejercicio-item {
            background: white;
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border-left: 5px solid #0f3460;
        }

        .ejercicio-item .ejercicio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .ejercicio-item .ejercicio-header .num {
            font-weight: 700;
            color: #0f3460;
        }

        .ejercicio-item .ejercicio-header .tipo {
            font-size: 12px;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 20px;
        }

        .ejercicio-item .ejercicio-enunciado-texto {
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 8px;
        }

        .ejercicio-item .ejercicio-enunciado {
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50px;
            border: 1px solid #e2e8f0;
        }

        .ejercicio-item .ejercicio-enunciado img {
            max-width: 100%;
            height: auto;
        }

        .ejercicio-item .ejercicio-solucion {
            margin-top: 10px;
            padding: 10px 16px;
            background: #ecfdf5;
            border-radius: 8px;
            border-left: 3px solid #10b981;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 40px;
        }

        .ejercicio-item .ejercicio-solucion img {
            max-width: 100%;
            height: auto;
        }

        .ejercicio-item .ejercicio-solucion-oculta {
            color: #94a3b8;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
                height: auto;
                position: relative;
                padding: 20px;
            }

            .main-content {
                padding: 20px;
            }
        }

        @media print {

            .sidebar,
            .header .acciones {
                display: none;
            }

            .main-content {
                padding: 0;
                background: white;
            }

            .ejercicio-item {
                box-shadow: none;
                border: 1px solid #ddd;
                break-inside: avoid;
            }
        }
    </style>
</head>

<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <h1>📐 <span>MEG</span></h1>
        <div class="subtitle">Math exercise generator</div>

        <!-- Categories generated by JavaScript -->
        <div id="categorias-container"></div>

        <!-- Botones -->
        <button class="btn-generar" id="btn-generar">📄 Generate PDF</button>
        <button class="btn-preview" id="btn-preview">👁️ Preview</button>

        <div class="opciones-extra">
            <label><input type="checkbox" id="mostrar_soluciones" checked> Show solutions</label>
            <label><input type="checkbox" id="seleccionar_todos"> Select all</label>
        </div>

        <div class="total-ejercicios" id="total-ejercicios">Total: 0 exercises</div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">
        <div class="header">
            <h2 id="titulo-resultados">📋 Generated exercises</h2>
            <div class="acciones">
                <button class="btn-imprimir" onclick="window.print()">🖨️ Print</button>
                <button class="btn-limpiar" id="btn-limpiar">✖ Clear</button>
            </div>
        </div>

        <div id="resultados">
            <div class="result-stats" id="result-stats"></div>
            <div id="resultados-content">
                <div class="loading">🔍 Select the types and generate exercises</div>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIGURACIÓN DE CATEGORÍAS =====
        const categorias = [
            {
                nombre: 'INTEGRALS',
                subtipos: [
                    { id: 'int_inmediata_potencia', nombre: 'Power', grupo: 'Immediate integrals' },
                    { id: 'int_inmediata_log', nombre: 'Logarithm', grupo: 'Immediate integrals' },
                    { id: 'int_inmediata_exp', nombre: 'Exponential', grupo: 'Immediate integrals' },
                    { id: 'int_inmediata_trig', nombre: 'Trigonometric', grupo: 'Immediate integrals' },
                    { id: 'int_inmediata_invtrig', nombre: 'Inverse trigonometric', grupo: 'Immediate integrals' },
                    { id: 'int_casi_potencia', nombre: 'Power', grupo: 'Nearly immediate integrals' },
                    { id: 'int_casi_log', nombre: 'Logarithm', grupo: 'Nearly immediate integrals' },
                    { id: 'int_casi_exp', nombre: 'Exponential', grupo: 'Nearly immediate integrals' },
                    { id: 'int_casi_trig', nombre: 'Trigonometric', grupo: 'Nearly immediate integrals' },
                    { id: 'int_casi_invtrig', nombre: 'Inverse trigonometric', grupo: 'Nearly immediate integrals' },
                    { id: 'int_casi_logacot', nombre: 'Logarithm + arctangent', grupo: 'Nearly immediate integrals' },
                    { id: 'int_rac_simples', nombre: 'With simple roots', grupo: 'Rational integrals' },
                    { id: 'int_rac_multiples', nombre: 'With repeated roots', grupo: 'Rational integrals' },
                    { id: 'int_rac_grado2', nombre: 'With a quadratic factor', grupo: 'Rational integrals' },
                    { id: 'int_trig', nombre: 'Trigonometric', grupo: 'Trigonometric integrals' },
                    { id: 'int_partes', nombre: 'By parts', grupo: 'Integration by parts' },
                    { id: 'int_cambio_fractrig', nombre: 'Trigonometric fraction', grupo: 'Substitution integrals' },
                    { id: 'int_cambio_irracional', nombre: 'Irrational function', grupo: 'Substitution integrals' }
                ]
            },
            {
                nombre: 'DERIVATIVES',
                subtipos: [
                    { id: 'der_polinomica', nombre: 'Polynomial', grupo: 'Basic derivatives' },
                    { id: 'der_trigonometrica', nombre: 'Trigonometric', grupo: 'Basic derivatives' },
                    { id: 'der_exponencial', nombre: 'Exponential', grupo: 'Basic derivatives' },
                    { id: 'der_logaritmica', nombre: 'Logarithmic', grupo: 'Basic derivatives' },
                    { id: 'der_regla_cadena', nombre: 'Chain rule', grupo: 'Composite derivatives' },
                    { id: 'der_implicita', nombre: 'Implicit derivative', grupo: 'Composite derivatives' }
                ]
            },
            {
                nombre: 'LIMITS',
                subtipos: [
                    { id: 'lim_infinito', nombre: 'At infinity', grupo: 'Basic limits' },
                    { id: 'lim_indeterminado', nombre: 'Indeterminate form', grupo: 'Basic limits' },
                    { id: 'lim_trigonometrico', nombre: 'Trigonometric', grupo: 'Basic limits' },
                    { id: 'lim_especial', nombre: 'Euler number', grupo: 'Special limits' }
                ]
            },
            {
                nombre: 'FRACTIONS',
                subtipos: [
                    { id: 'frac_simplificar', nombre: 'Simplify', grupo: 'Operations' },
                    { id: 'frac_sumar', nombre: 'Addition', grupo: 'Operations' },
                    { id: 'frac_multiplicar', nombre: 'Multiplication', grupo: 'Operations' },
                    { id: 'frac_division', nombre: 'Division', grupo: 'Operations' }
                ]
            },
            {
                nombre: 'FUNCTIONS',
                subtipos: [
                    { id: 'func_dominio', nombre: 'Domain', grupo: 'Basic analysis' },
                    { id: 'func_recorrido', nombre: 'Range', grupo: 'Basic analysis' },
                    { id: 'func_ceros', nombre: 'Zeros', grupo: 'Basic analysis' },
                    { id: 'func_crecimiento', nombre: 'Growth', grupo: 'Basic analysis' }
                ]
            },
            {
                nombre: 'EXTREMA',
                subtipos: [
                    { id: 'ext_polinomico', nombre: 'Polynomial', grupo: 'Extrema' },
                    { id: 'ext_trigonometrico', nombre: 'Trigonometric', grupo: 'Extrema' },
                    { id: 'ext_racional', nombre: 'Rational', grupo: 'Extrema' }
                ]
            },
            {
                nombre: 'ASYMPTOTES',
                subtipos: [
                    { id: 'asint_vertical', nombre: 'Vertical', grupo: 'Asymptotes' },
                    { id: 'asint_horizontal', nombre: 'Horizontal', grupo: 'Asymptotes' },
                    { id: 'asint_oblicua', nombre: 'Oblique', grupo: 'Asymptotes' },
                    { id: 'asint_mixta', nombre: 'Multiple', grupo: 'Asymptotes' }
                ]
            },
            {
                nombre: 'ANALYSIS',
                subtipos: [
                    { id: 'anal_polinomico', nombre: 'Polynomial', grupo: 'Complete analysis' },
                    { id: 'anal_racional', nombre: 'Rational', grupo: 'Complete analysis' },
                    { id: 'anal_trigonometrico', nombre: 'Trigonometric', grupo: 'Complete analysis' }
                ]
            }
        ];

        // ===== ESTADO =====
        let cantidades = {};
        let ejerciciosGenerados = [];

        // ===== RENDERIZAR SIDEBAR =====
        function renderizarSidebar() {
            const container = document.getElementById('categorias-container');
            let html = '';

            categorias.forEach(cat => {
                // Group subtypes by group
                const grupos = {};
                cat.subtipos.forEach(st => {
                    if (!grupos[st.grupo]) grupos[st.grupo] = [];
                    grupos[st.grupo].push(st);
                });

                html += `<div class="categoria">`;
                html += `<div class="categoria-header" onclick="toggleCategoria(this)">
                            ${cat.nombre}
                            <span class="toggle">▼</span>
                        </div>`;
                html += `<div class="subtipos abierto">`;

                for (const [grupo, items] of Object.entries(grupos)) {
                    html += `<div style="font-size:11px;color:#90caf9;padding:8px 12px 4px;font-weight:600;">${grupo}</div>`;
                    items.forEach(st => {
                        const id = st.id;
                        if (!(id in cantidades)) cantidades[id] = 0;
                        html += `
                            <div class="subtipo-item">
                                <span>${st.nombre}</span>
                                <div class="controles">
                                    <button onclick="cambiarCantidad('${id}', -1)">−</button>
                                    <span class="cantidad" id="cnt_${id}">${cantidades[id]}</span>
                                    <button onclick="cambiarCantidad('${id}', 1)">+</button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `</div></div>`;
            });

            container.innerHTML = html;
            actualizarTotal();
        }

        // ===== FUNCIONES DE LA SIDEBAR =====
        function toggleCategoria(header) {
            const subtipos = header.nextElementSibling;
            const toggle = header.querySelector('.toggle');
            subtipos.classList.toggle('abierto');
            toggle.classList.toggle('abierto');
        }

        function cambiarCantidad(id, delta) {
            const nuevo = (cantidades[id] || 0) + delta;
            if (nuevo < 0) return;
            cantidades[id] = nuevo;
            document.getElementById(`cnt_${id}`).textContent = nuevo;
            actualizarTotal();
        }

        function actualizarTotal() {
            const total = Object.values(cantidades).reduce((a, b) => a + b, 0);
            document.getElementById('total-ejercicios').textContent = `Total: ${total} exercises`;
            return total;
        }

        // ===== SELECCIONAR TODOS =====
        document.getElementById('seleccionar_todos').addEventListener('change', function () {
            const valor = this.checked ? 2 : 0;
            for (const id in cantidades) {
                cantidades[id] = valor;
                document.getElementById(`cnt_${id}`).textContent = valor;
            }
            actualizarTotal();
        });

        // ===== OBTENER TIPOS SELECCIONADOS =====
        function obtenerTiposSeleccionados() {
            const tipos = [];
            for (const [id, cantidad] of Object.entries(cantidades)) {
                if (cantidad > 0) {
                    tipos.push({ id, cantidad });
                }
            }
            return tipos;
        }

        // ===== GENERAR / PREVISUALIZAR =====
        async function generar(esPreview) {
            const tipos = obtenerTiposSeleccionados();
            if (tipos.length === 0) {
                alert('⚠️ Select at least one subtype with quantity > 0');
                return;
            }

            const total = tipos.reduce((s, t) => s + t.cantidad, 0);
            const data = {
                tipos: tipos,
                dificultad: 'media',
                mostrar_soluciones: document.getElementById('mostrar_soluciones').checked,
                es_preview: esPreview
            };

            const btn = document.getElementById('btn-generar');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Generando...';
            btn.disabled = true;

            try {
                const endpoint = esPreview ? '/api/preview' : '/api/generar';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Error');
                }

                if (esPreview) {
                    const ejercicios = await response.json();
                    mostrarResultados(ejercicios, data.mostrar_soluciones);
                } else {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `MEG_${Date.now()}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                    alert(`✅ PDF generated with ${total} exercises`);
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
                console.error(error);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        document.getElementById('btn-generar').addEventListener('click', () => generar(false));
        document.getElementById('btn-preview').addEventListener('click', () => generar(true));

        // ===== MOSTRAR RESULTADOS =====
        function mostrarResultados(ejercicios, mostrarSoluciones) {
            const container = document.getElementById('resultados');
            const content = document.getElementById('resultados-content');
            const stats = document.getElementById('result-stats');

            container.style.display = 'block';
            ejerciciosGenerados = ejercicios;

            // Stats
            const tiposMap = {};
            ejercicios.forEach(ej => {
                const t = ej.tipo || 'Desconocido';
                tiposMap[t] = (tiposMap[t] || 0) + 1;
            });
            let statsHtml = `<div class="stat"><strong>Total:</strong> ${ejercicios.length} exercises</div>`;
            for (const [tipo, count] of Object.entries(tiposMap)) {
                statsHtml += `<div class="stat"><strong>${tipo}:</strong> ${count}</div>`;
            }
            stats.innerHTML = statsHtml;

            if (ejercicios.length === 0) {
                content.innerHTML = '<div class="loading">⚠️ No exercises were generated</div>';
                return;
            }

            let html = '';
            ejercicios.forEach((ej, i) => {
                const enunciadoTexto = ej.enunciado_texto || '';
                const enunciadoImg = ej.enunciado_html || (ej.enunciado_img ?
                    `<img src="data:image/png;base64,${ej.enunciado_img}" alt="Enunciado">` :
                    `<span>${ej.enunciado || 'No statement'}</span>`);

                let solucionHtml = '';
                if (mostrarSoluciones) {
                    if (ej.solucion_html) {
                        solucionHtml = ej.solucion_html;
                    } else if (ej.solucion_img) {
                        solucionHtml = `<img src="data:image/png;base64,${ej.solucion_img}" alt="Solution">`;
                    } else if (ej.solucion) {
                        solucionHtml = `<span>${ej.solucion}</span>`;
                    } else {
                        solucionHtml = '<span class="ejercicio-solucion-oculta">🔍 No solution</span>';
                    }
                } else {
                    solucionHtml = '<span class="ejercicio-solucion-oculta">🔒 Solution hidden</span>';
                }

                html += `
                    <div class="ejercicio-item">
                        <div class="ejercicio-header">
                            <span class="num">${i + 1}.</span>
                            <span class="tipo">${ej.tipo || 'Exercise'}</span>
                        </div>
                        ${enunciadoTexto ? `<div class="ejercicio-enunciado-texto">${enunciadoTexto}</div>` : ''}
                        <div class="ejercicio-enunciado">${enunciadoImg}</div>
                        <div class="ejercicio-solucion">${solucionHtml}</div>
                    </div>
                `;
            });

            content.innerHTML = html;
            document.getElementById('titulo-resultados').textContent = `📋 Generated exercises (${ejercicios.length})`;
        }

        // ===== LIMPIAR =====
        document.getElementById('btn-limpiar').addEventListener('click', function () {
            document.getElementById('resultados').style.display = 'none';
            ejerciciosGenerados = [];
        });

        // ===== INICIALIZAR =====
        renderizarSidebar();
    </script>

</body>

</html>
